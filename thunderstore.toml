[config]
schemaVersion = "0.0.1"

[package]
namespace = "pacoito"
name = "itolib"
description = "[v80] Wondrous gizmos and gadgets for the restless mind."
websiteUrl = "https://github.com/pacoito123/LC_itolib"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"
IAmBatby-LethalLevelLoader = "1.6.9"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./itolib/dist"

[[build.copy]]
source = "./itolib/bin/Release/netstandard2.1/itolib.dll"
target = "./BepInEx/plugins/"

[[build.copy]]
source = "./itolib/bin/Release/netstandard2.1/itolib.deps.json"
target = "./BepInEx/plugins/"

[[build.copy]]
source = "./itolib/bin/Release/netstandard2.1/itolib.xml"
target = "./BepInEx/plugins/"

[[build.copy]]
source = "./CHANGELOG.md"
target = "./"

[[build.copy]]
source = "./LICENSE"
target = "./"

[publish]
repository = "https://thunderstore.io"
communities = [ "lethal-company" ]

[publish.categories]
lethal-company = [ "mods", "libraries", "bepinex", "clientside", "serverside" ]